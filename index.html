
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybervast Student Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <img
                src="images/cybervast-logo.png"
                alt="Cybervast Logo"
                style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 55px; height: 55px; object-fit: contain;"
            >

            <h1>CYBERVAST</h1>
            <p>Student Attendance Portal</p>
        </header>

        <main>

            <h2>Record Attendance</h2>
            <p class="description">
                Select your course and enter your name, then load students to view the recommended next training session.
            </p>

            <form id="attendanceForm">

                <label for="course">Select Course</label>
                <select id="course" required>
                    <option value="">Choose a course</option>
                </select>

                <div id="sessionContainer">
                    <label for="session">Training Session</label>
                    <select id="session" required disabled>
                        <option value="">Load students to view the recommended next training session.</option>
                    </select>
                </div>

                <button type="button" id="loadStudents">
                    Load Students
                </button>

            </form>

            <div id="studentSection" hidden>

                <h3>Student Attendance</h3>

                <div id="studentList"></div>

                <button type="button" id="submitAttendance">
                    Submit Attendance
                </button>

            </div>

            <p id="message"></p>

        </main>

        <footer>
            <p>Cybervast Student Attendance System</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
